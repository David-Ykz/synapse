apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .AgentName }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .AgentName }}
spec:
  replicas: {{ .Replicas }}
  selector:
    matchLabels:
      app: {{ .AgentName }}
  template:
    metadata:
      labels:
        app: {{ .AgentName }}
    spec:
      containers:
      - name: agent
        image: {{ .Image }}
        env:
        - name: BROKER_HOST
          value: "synapse-broker-client"
        - name: BROKER_PORT
          value: "8080"
        - name: SYNAPSE_CONSUME_NAMESPACES
          value: "{{ .ConsumeNamespaces }}"
        - name: SYNAPSE_PRODUCE_NAMESPACES
          value: "{{ .ProduceNamespaces }}"
{{- range .Env }}
        - name: {{ .Name }}
          value: "{{ .Value }}"
{{- end }}
{{- if .EnvFromSecrets }}
        envFrom:
{{- range .EnvFromSecrets }}
        - secretRef:
            name: {{ . }}
{{- end }}
{{- end }}
{{- if .HPA }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .AgentName }}
  namespace: {{ .Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .AgentName }}
  minReplicas: {{ .HPA.MinReplicas }}
  maxReplicas: {{ .HPA.MaxReplicas }}
  metrics:
    - type: External
      external:
        metric:
          name: synapse_broker_lag
          selector:
            matchExpressions:
              - key: queue
                operator: In
                values:
{{- range .HPA.ConsumeNamespaces }}
                  - {{ . }}
{{- end }}
        target:
          type: AverageValue
          averageValue: "{{ .HPA.LagPerReplica }}"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .HPA.ScaleDownStabilizationSeconds }}
{{- end }}
